{% extends "baseadmin.html" %}

{% block content %}
<div class="soko-admin-wrapper">
    <div class="soko-admin-card">
        <h2 class="sketched-header">Register New Admin</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="soko-alert {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="input-group">
                <label>Admin Username</label>
                <input type="text" name="username" placeholder="e.g. soko_manager" required>
            </div>

            <div class="input-group">
                <label>Access Password</label>
                <input type="password" name="password" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required>
            </div>

            <button type="submit" class="btn-soko-add">Grant Dashboard Access</button>
        </form>
        
        <p class="soko-tag">Gadget Soko Kenya | Built by Hand</p>
    </div>
</div>

<style>
.soko-admin-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 85vh;
    background: #fdfdfd;
}

.soko-admin-card {
    background: #fff;
    padding: 35px;
    width: 100%;
    max-width: 400px;
    border: 3px solid #222;
    /* Sketched wobbly border */
    border-radius: 255px 25px 225px 25px/25px 225px 25px 255px;
    box-shadow: 12px 12px 0px #222;
}

.sketched-header {
    text-align: center;
    margin-bottom: 30px;
    font-weight: 800;
    text-decoration: underline wavy #ffa502;
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    font-size: 0.9rem;
}

.soko-admin-card input {
    width: 100%;
    padding: 12px;
    border: 2px solid #222;
    border-radius: 5px;
    background: #fff;
    box-sizing: border-box;
}

.btn-soko-add {
    width: 100%;
    padding: 15px;
    background: #222;
    color: #fff;
    border: none;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    transition: 0.2s;
}

.btn-soko-add:hover {
    background: #ffa502;
    color: #000;
    transform: translateY(-3px);
}

.soko-alert {
    padding: 10px;
    border: 2px solid;
    margin-bottom: 20px;
    border-radius: 5px;
    font-size: 0.85rem;
}

.soko-alert.success { background: #dff9fb; border-color: #130f40; }
.soko-alert.error { background: #fab1a0; border-color: #d63031; }

.soko-tag {
    text-align: center;
    margin-top: 25px;
    font-size: 0.7rem;
    color: #999;
    letter-spacing: 1px;
}
</style>
{% endblock %}
