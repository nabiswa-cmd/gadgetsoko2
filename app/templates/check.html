{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Gadget Soko Kenya</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { 
            --primary: #ff5a2c; 
            --secondary: #111;
            --mpesa: #00a650; 
            --bg: #f4f6f9; 
            --border: #e1e1e1;
        }
        
        body { background: var(--bg); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; color: #333; }
        
        .checkout-wrapper { 
            width: 95%; 
            max-width: 1100px; 
            margin: 20px auto; 
            display: grid; 
            grid-template-columns: 1.5fr 1fr; 
            gap: 20px; 
        }

        @media (max-width: 900px) {
            .checkout-wrapper { grid-template-columns: 1fr; }
        }

        .card { 
            background: white; padding: 30px; border-radius: 16px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); height: fit-content; margin-bottom: 20px;
        }
        
        h2, h3 { margin-top: 0; color: var(--secondary); font-size: 1.3rem; display: flex; align-items: center; gap: 10px; }

        /* Location Selector */
        .location-picker { 
            display: flex; gap: 10px; margin: 15px 0 25px; 
            background: #eee; padding: 5px; border-radius: 12px; 
        }
        .loc-btn { 
            flex: 1; padding: 12px; border: none; border-radius: 10px; 
            cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 13px; color: #666; background: transparent;
        }
        .loc-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        .form-group { margin-bottom: 15px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #555; }
        input, select, textarea { 
            width: 100%; padding: 12px; border: 1.5px solid var(--border); 
            border-radius: 8px; font-size: 15px; box-sizing: border-box;
        }

        /* Payment Options */
        .payment-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-top: 10px; }
        .pay-opt { 
            border: 2px solid #f0f0f0; border-radius: 12px; padding: 10px; 
            text-align: center; cursor: pointer; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 90px; background: #fafafa;
        }
        .pay-opt input { display: none; }
        .pay-opt img { max-height: 25px; margin-bottom: 8px; }
        .pay-opt i { font-size: 24px; margin-bottom: 8px; color: var(--primary); }
        .pay-opt.selected { border-color: var(--primary); background: #fff5f2; }

        /* Agreement Section */
        .agreement-section { margin-top: 25px; padding-top: 20px; border-top: 1.5px solid #eee; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; cursor: pointer; }
        .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }
        .checkbox-group span { font-size: 13px; color: #444; line-height: 1.4; }

        /* Summary */
        .summary-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f9f9f9; }
        .total-price { 
            font-size: 20px; font-weight: 800; border-top: 2px solid #eee;
            margin-top: 15px; padding-top: 15px; color: var(--primary);
        }

        .btn-submit { 
            background: #ccc; color: white; border: none; 
            width: 100%; padding: 18px; border-radius: 12px; 
            font-size: 16px; font-weight: bold; cursor: not-allowed; margin-top: 20px;
            transition: 0.3s;
        }
        .btn-submit.ready { background: var(--primary); cursor: pointer; box-shadow: 0 4px 12px rgba(255, 90, 44, 0.3); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="checkout-wrapper">
    <div class="card">
        <h2><i class="fa fa-shopping-bag"></i> Checkout</h2>
        
        <label>Select Your Location</label>
        <div class="location-picker">
            <button type="button" class="loc-btn active" id="btn-nairobi" onclick="updateLocation('nairobi')">Nairobi</button>
            <button type="button" class="loc-btn" id="btn-outside" onclick="updateLocation('outside')">Upcountry</button>
        </div>

        <form method="POST" action="{% url 'check' %}" id="checkout-form">
            {% csrf_token %}
            <input type="hidden" name="region" id="region-input" value="nairobi">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Name on ID" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>M-Pesa Number</label>
                    <input type="tel" name="phone" id="phone-input" placeholder="0712345678" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="example@gmail.com" required>
                </div>
            </div>

            <div id="nairobi-fields">
                <div class="form-group">
                    <label>Nearest Estate / Landmark</label>
                    <select name="nairobi_area">
                        <option value="CBD">CBD / Town</option>
                        <option value="Westlands">Westlands</option>
                        <option value="Eastlands">Eastlands</option>
                        <option value="Roysambu">Roysambu</option>
                        <option value="Langata">Langata</option>
                    </select>
                </div>
            </div>

            <div id="outside-fields" class="hidden">
                <div class="form-group">
                    <label>Destination Town</label>
                    <input type="text" name="outside_town" placeholder="e.g. Mombasa, Kisumu">
                </div>
            </div>

            <div class="form-group">
                <label>Detailed Address</label>
                <textarea name="address" rows="2" placeholder="Building name, Floor, Room number..." required></textarea>
            </div>

            <h3><i class="fa fa-credit-card"></i> Payment Method</h3>
            <div class="payment-grid">
                <label class="pay-opt selected" onclick="selectPay(this, 'mpesa')">
                    <input type="radio" name="payment_method" value="mpesa" checked>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/M-PESA_LOGO-01.svg/1200px-M-PESA_LOGO-01.svg.png" alt="Mpesa" width="80">
                    <span>M-Pesa Prompt</span>
                </label>
                <label class="pay-opt" id="pod-option" onclick="selectPay(this, 'pod')">
                    <input type="radio" name="payment_method" value="pod">
                    <i class="fa fa-truck-fast"></i>
                    <span>Pay on Delivery</span>
                </label>
            </div>

            <div class="agreement-section">
                <label class="checkbox-group">
                    <input type="checkbox" id="check-terms" onchange="validateAgreements()">
                    <span>I agree to the <strong>Terms & Conditions</strong> of Gadget Soko Kenya.</span>
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" id="check-shipping" onchange="validateAgreements()">
                    <span>I confirm that the final shipping fee will be calculated based on my <strong>delivery location</strong> and <strong>item weight</strong>.</span>
                </label>
            </div>

            <button type="submit" id="submit-btn" class="btn-submit" disabled>
                Complete Order (KES <span id="btn-total-val">0</span>)
            </button>
        </form>
    </div>

    <div class="card">
        <h3><i class="fa fa-list-check"></i> Order Summary</h3>
        {% for item in cart_items %}
        <div class="summary-row">
            <span>{{ item.product.name }} (x{{ item.quantity }})</span>
            <strong>KES {{ item.get_total }}</strong>
        </div>
        {% endfor %}

        <div class="summary-row total-price">
            <span>Subtotal</span>
            <span id="grand-total-val">KES {{ subtotal }}</span>
        </div>
        <p style="font-size:11px; color:#777; margin-top:15px; text-align:center;">
            <i class="fa fa-lock"></i> Secure Checkout - Gadget Soko
        </p>
    </div>
</div>

<script>
const subtotal = parseFloat("{{ subtotal|default:0 }}");
const shippingNairobi = parseFloat("{{ shipping_nairobi|default:0 }}");
const shippingOutside = parseFloat("{{ max_shipping|default:0 }}");

function updateLocation(loc) {
    const btnNairobi = document.getElementById('btn-nairobi');
    const btnOutside = document.getElementById('btn-outside');
    const nairobiFields = document.getElementById('nairobi-fields');
    const outsideFields = document.getElementById('outside-fields');
    const podOption = document.getElementById('pod-option');
    const regionInput = document.getElementById('region-input');

    btnNairobi.classList.toggle('active', loc === 'nairobi');
    btnOutside.classList.toggle('active', loc === 'outside');

    if (loc === 'nairobi') {
        nairobiFields.classList.remove('hidden');
        outsideFields.classList.add('hidden');
        regionInput.value = "nairobi";
        if (podOption) podOption.style.display = 'flex';
        updateTotals(shippingNairobi);
    } else {
        nairobiFields.classList.add('hidden');
        outsideFields.classList.remove('hidden');
        regionInput.value = "outside";
        if (podOption) podOption.style.display = 'none';
        
        // Force switch payment if POD was selected
        const currentPay = document.querySelector('input[name="payment_method"]:checked');
        if (currentPay && currentPay.value === 'pod') {
            selectPay(document.querySelector('.pay-opt'), 'mpesa');
        }
        updateTotals(shippingOutside);
    }
}

function updateTotals(shipping) {
    const total = subtotal + shipping;
    const formatted = total.toLocaleString();
    document.getElementById('grand-total-val').innerText = "KES " + formatted;
    document.getElementById('btn-total-val').innerText = formatted;
}

function selectPay(el, method) {
    document.querySelectorAll('.pay-opt').forEach(opt => opt.classList.remove('selected'));
    el.classList.add('selected');
    const radio = el.querySelector('input[type="radio"]');
    if (radio) radio.checked = true;
}

function validateAgreements() {
    const terms = document.getElementById('check-terms').checked;
    const shipping = document.getElementById('check-shipping').checked;
    const btn = document.getElementById('submit-btn');

    if (terms && shipping) {
        btn.disabled = false;
        btn.classList.add('ready');
    } else {
        btn.disabled = true;
        btn.classList.remove('ready');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    updateLocation('nairobi');
    
    document.getElementById('checkout-form').onsubmit = function(e) {
        const phone = document.getElementById('phone-input').value.trim();
        const phoneRegex = /^(07|01|254|\+254)\d{8}$/;
        
        if (!phoneRegex.test(phone)) {
            alert("Invalid M-Pesa number. Use 07... or 01...");
            e.preventDefault();
            return false;
        }
        this.querySelector('.btn-submit').innerText = "Processing...";
    };
});
</script>

</body>
</html>
