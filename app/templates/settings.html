{% extends "baseadmin.html" %}

{% block title %}Settings | Gadget Soko{% endblock %}
{% block header %}Settings{% endblock %}

{% block content %}
<style>
    /* Settings Page */
h2 {
    margin: 1.5rem 0 1rem;
    font-size: 1.3rem;
    color: #222;
    border-left: 4px solid #ff5a2c;
    padding-left: 0.5rem;
}

/* Buttons */
button {
    background: #ff5a2c;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.75rem 1.5rem;
    margin-right: 1rem;
    margin-bottom: 1rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
}

button:hover {
    background: #e14d22;
    transform: translateY(-2px);
}

button:active {
    transform: translateY(0);
    background: #c43f1b;
}

</style>
<h2>Admin Settings</h2>
<button>Change Password</button>
<button>Add Admin</button>
{% endblock %}
